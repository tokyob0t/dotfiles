keypress_delay_ms: 10

modmap:
  - name: Make ⌘ act as Ctrl
    remap:
      LeftCtrl: LeftMeta
      LeftMeta: LeftCtrl
      RightCtrl: RightMeta
      RightMeta: RightCtrl

keymap:
  - name: Ctrl-X remap to Alt-X
    remap:
      Ctrl-1: Alt-1
      Ctrl-2: Alt-2
      Ctrl-3: Alt-3
      Ctrl-4: Alt-4
      Ctrl-5: Alt-5
      Ctrl-6: Alt-6
      Ctrl-7: Alt-7
      Ctrl-8: Alt-8
      Ctrl-9: Alt-9
  - name: Remap Ctrl+Q to Super+W
    remap:
      Ctrl-Shift-W: Super-W
  - name: Nautilus (Files) shortcuts
    application:
      only: org.gnome.Nautilus
    remap:
      Ctrl-Backspace: Delete   # Move to Trash
